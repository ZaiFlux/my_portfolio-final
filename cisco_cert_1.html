<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Cyber Threat Management</title>

    <link rel="stylesheet" href="cisco_cert_1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- BADGE CONTAINER - SAME AS IBM -->
    <div class="cert-container">
        <img src="images/cert5.png" alt="Cisco Badge">
    </div>

    <div class="details">
        <h1 class="cert_title">
            Cyber Threat Management
        </h1>

        <h2 class="provider">
            <strong>Provider:</strong> Cisco Networking Academy
        </h2>

        <h2 class="issuer_date">
            <strong>Issued Date:</strong> January 2024
        </h2>

        <h2 class="credential_id">
            <strong>Credential ID:</strong> CISCO-CTM-12345
        </h2>

        <h2 class="skills">
            <strong>Skills:</strong> Incident Response, Threat Intelligence, Vulnerability Assessment, Security Monitoring
        </h2>

        <h2 class="verification_link">
            <a href="#"><i class="fas fa-check-circle"></i> Verify this credential</a>
        </h2>
    </div>

</body>
</html>
