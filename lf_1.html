<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Certificates</title>

    <link rel="stylesheet" href="lf_1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="cert-container" style="display:flex; align-items:center; justify-content:center; padding:35px;">
        <!-- BIG CIRCULAR BADGE INSIDE THE CONTAINER -->
        <img src="images/cert2.png" alt="Certificate Badge" style="width:250px; height:250px; border-radius:50%; object-fit:cover; border:5px solid rgba(255,255,255,0.8); box-shadow:0 10px 40px rgba(0,0,0,0.2);">
    </div>

    <div class="details">
        <h1 class="cert_title">
            AWS Cloud Practitioner Essentials
        </h1>

        <h2 class="provider">
            Provider: Amazon Web Services
        </h2>

        <h2 class="issuer_date">
            Issued Date: January 2024
        </h2>

        <h2 class="credential_id">
            Credential ID: AWS-12345-67890
        </h2>

        <h2 class="skills">
            Skills: Cloud Concepts, AWS Services, Security, Pricing
        </h2>

        <h2 class="verification_link">
            <a href="#">Verify this credential</a>
        </h2>
    </div>

</body>
</html>
