<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Local Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        .test-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #111827;
            margin-bottom: 20px;
        }
        .image-box {
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin: 20px auto;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f9fafb;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .info {
            margin: 20px 0;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 8px;
            font-size: 14px;
            color: #374151;
        }
        .success {
            color: #16a34a;
            font-weight: bold;
        }
        .error {
            color: #dc2626;
            font-weight: bold;
        }
        .test-paths {
            text-align: left;
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .test-paths p {
            margin: 5px 0;
            font-family: monospace;
            font-size: 13px;
        }
        button {
            padding: 10px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .path-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        .path-status.working {
            background: #dcfce7;
            color: #16a34a;
        }
        .path-status.failed {
            background: #fee2e2;
            color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔍 Test Your Local Image</h1>
        <p>This page tests if <code>cert01.png</code> loads from your images folder.</p>

        <!-- Image Display -->
        <div class="image-box" id="imageBox">
            <img id="testImage" src="" alt="Test Image">
        </div>

        <!-- Status -->
        <div class="info" id="statusInfo">
            ⏳ Loading image...
        </div>

        <!-- Test Paths -->
        <div class="test-paths">
            <h4>Testing Paths:</h4>
            <p id="path1">📁 images/cert01.png <span class="path-status" id="status1">⏳ Testing...</span></p>
            <p id="path2">📁 ./images/cert01.png <span class="path-status" id="status2">⏳ Testing...</span></p>
            <p id="path3">📁 /images/cert01.png <span class="path-status" id="status3">⏳ Testing...</span></p>
        </div>

        <!-- Buttons -->
        <div>
            <button onclick="testPath('images/cert01.png')">Test images/cert01.png</button>
            <button onclick="testPath('https://d1.awsstatic.com/training-and-certification/certification-badges/AWS-Certified-Cloud-Practitioner_badge.634f8a21af2e0e956ed8905a72366146ba22b74c.png')">Test AWS URL</button>
            <button onclick="testPath('images/placeholder.png')">Test placeholder</button>
        </div>

        <p style="margin-top: 20px; font-size: 13px; color: #6b7280;">
            💡 Your image should be at: <code>my_portfolio/images/cert01.png</code>
        </p>
    </div>

    <script>
        function testPath(path) {
            const img = document.getElementById('testImage');
            const info = document.getElementById('statusInfo');
            
            img.onload = function() {
                info.innerHTML = `✅ <span class="success">SUCCESS!</span> Image loaded from: <code>${path}</code>`;
                info.style.background = '#dcfce7';
            };
            
            img.onerror = function() {
                info.innerHTML = `❌ <span class="error">FAILED!</span> Could not load: <code>${path}</code><br>
                Make sure the file exists at <code>my_portfolio/images/cert01.png</code>`;
                info.style.background = '#fee2e2';
            };
            
            info.innerHTML = `⏳ Loading: <code>${path}</code>...`;
            info.style.background = '#f3f4f6';
            img.src = path + '?t=' + Date.now(); // Cache bust
        }

        // Auto-test local image on page load
        window.onload = function() {
            testPath('images/cert01.png');
        };
    </script>
</body>
</html>
