<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Certificates</title>

    <link rel="stylesheet" href="ibm_cert_1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="cert-container" style="padding:0; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;">
        <!-- PROFILE PICTURE - SHOWS ENTIRE IMAGE WITHOUT CROPPING -->
        <img src="images/cert6.png" alt="Profile Picture" style="width:100%; height:100%; object-fit:contain; display:block;">
    </div>

    <div class="details">
        <h1 class="cert_title">
            AWS Cloud Practitioner Essentials
        </h1>

        <h2 class="provider">
            Provider: Amazon Web Services
        </h2>

        <h2 class="issuer_date">
            Issued Date: January 2024
        </h2>

        <h2 class="credential_id">
            Credential ID: AWS-12345-67890
        </h2>

        <h2 class="skills">
            Skills: Cloud Concepts, AWS Services, Security, Pricing
        </h2>

        <h2 class="verification_link">
            <a href="#">Verify this credential</a>
        </h2>
    </div>

</body>
</html>
